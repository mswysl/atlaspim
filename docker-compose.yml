services:
  pim-api:
    build: .
    container_name: atlas-pim
    ports:
      - "3100:3100"
    environment:
      PORT: 3100
      DATABASE_URL: postgresql://pim:pim@pim-postgres:5432/pimdb?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEDUSA_URL: http://medusa:9000
      MEDUSA_API_KEY: ${MEDUSA_API_KEY:-replace-me}
      PIM_API_KEY: ${PIM_API_KEY:-change-me}
    depends_on:
      - pim-postgres
      - redis
  pim-postgres:
    image: postgres:16
    container_name: pim-postgres
    environment:
      POSTGRES_DB: pimdb
      POSTGRES_USER: pim
      POSTGRES_PASSWORD: pim
    ports:
      - "5434:5432"
    volumes:
      - pim-pg-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: pim-redis
    ports:
      - "6380:6379"
volumes:
  pim-pg-data:
